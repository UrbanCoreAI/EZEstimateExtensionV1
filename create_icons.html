<!DOCTYPE html>
<!-- Run this page in a browser, then right-click each canvas and "Save image as" to icons/ folder -->
<html>
<body>
<script>
function makeIcon(size) {
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');

  // Background
  ctx.fillStyle = '#1a1a2e';
  ctx.beginPath();
  ctx.roundRect(0, 0, size, size, size * 0.18);
  ctx.fill();

  // Letters EZ
  ctx.fillStyle = '#e8b84b';
  ctx.font = `bold ${size * 0.44}px Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('EZ', size / 2, size / 2 + size * 0.03);

  document.body.appendChild(canvas);
  const link = document.createElement('a');
  link.download = `icon${size}.png`;
  link.href = canvas.toDataURL();
  link.textContent = `Download icon${size}.png`;
  link.style.display = 'block';
  document.body.appendChild(link);
}
[16, 48, 128].forEach(makeIcon);
</script>
</body>
</html>
