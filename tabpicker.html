<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Select Estimate Tab � Keel EZ Estimate</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:       #1a1a2e;
    --navy-mid:   #24243e;
    --gold:       #e8b84b;
    --gold-dk:    #c9983a;
    --surface:    #f2f4f7;
    --card:       #ffffff;
    --text:       #1e293b;
    --muted:      #64748b;
    --border:     #e2e8f0;
    --success-bg: #f0fdf4;
    --success-bdr:#86efac;
    --error-bg:   #fff1f2;
    --error-bdr:  #fda4af;
  }

  html, body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--surface);
    color: var(--text);
    height: 100%;
    -webkit-font-smoothing: antialiased;
  }

  header {
    background: var(--navy);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-mark {
    width: 30px; height: 30px;
    background: var(--gold);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 800;
    color: var(--navy);
  }
  .hdr-text { flex: 1; min-width: 0; }
  .hdr-title { font-size: 14px; font-weight: 700; color: #fff; }
  .hdr-sub { font-size: 11px; color: rgba(255,255,255,0.55); margin-top: 1px; }

  main { padding: 14px 16px 18px; }

  .hint {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .cp-warning {
    font-size: 12px;
    color: #7a5b00;
    background: #fff6da;
    border: 1px solid #f0d989;
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 10px;
    line-height: 1.4;
  }

  .btn-refresh {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    font-size: 11px;
    padding: 4px 10px;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-refresh:hover { background: #fff; color: var(--text); }

  #tab-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 420px;
    overflow-y: auto;
  }

  .tab-row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: border-color 0.12s, box-shadow 0.12s;
  }
  .tab-row:hover { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(232,184,75,.15); }
  .tab-row.recommended { border-color: #c9983a; background: #fffbf0; }

  .favicon { width: 18px; height: 18px; flex-shrink: 0; border-radius: 3px; }

  .tab-info { flex: 1; min-width: 0; }
  .tab-title {
    font-size: 13px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tab-url {
    font-size: 11px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .badge {
    background: var(--gold);
    color: var(--navy);
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    flex-shrink: 0;
    white-space: nowrap;
  }

  .loading, .empty {
    font-size: 13px;
    color: var(--muted);
    padding: 24px 4px;
    text-align: center;
  }

  .hidden { display: none !important; }

  /* -- Progress view -- */
  #progress-view { }

  .progress-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 4px;
  }
  .progress-status {
    font-size: 12px;
    padding: 8px 12px;
    border-radius: 8px;
    margin-bottom: 10px;
    background: #eff6ff;
    border: 1px solid #93c5fd;
    color: #1e40af;
  }
  .progress-status.success { background: var(--success-bg); border-color: var(--success-bdr); color: #15803d; }
  .progress-status.error   { background: var(--error-bg);   border-color: var(--error-bdr);   color: #be123c; }

  #log {
    background: var(--navy);
    color: #a8b4c4;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 11.5px;
    font-family: 'Menlo', 'Consolas', 'Monaco', monospace;
    line-height: 1.6;
    max-height: 320px;
    overflow-y: auto;
    white-space: pre-wrap;
    margin-bottom: 12px;
    min-height: 60px;
  }

  .spin {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid rgba(255,255,255,0.25);
    border-top-color: #fff;
    border-radius: 50%;
    animation: rotating 0.6s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes rotating { to { transform: rotate(360deg); } }

  .btn-row { display: flex; gap: 8px; }
  .btn-secondary, .btn-primary {
    height: 34px;
    padding: 0 16px;
    border-radius: 7px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    border: none;
  }
  .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .btn-secondary:hover { background: #fff; color: var(--text); }
  .btn-primary { background: var(--gold); color: var(--navy); }
  .btn-primary:hover { background: var(--gold-dk); }
</style>
</head>
<body>

<header>
  <div class="logo-mark">DE</div>
  <div class="hdr-text">
    <div class="hdr-title">Write to Estimate</div>
    <div class="hdr-sub" id="item-count">Loading items�</div>
  </div>
</header>

<main>
  <div id="picker-view">
    <div id="cp-warning" class="cp-warning hidden">? If running Client Preview more than once, reload EZEstimate &amp; sign in again.</div>
    <div class="hint">
      <span>Pick the BuilderTrend Estimate tab to write into � just like choosing a tab to share.</span>
      <button class="btn-refresh" id="btn-refresh">Refresh</button>
    </div>
    <div id="tab-list"><div class="loading">Loading open tabs�</div></div>
  </div>

  <div id="progress-view" class="hidden">
    <div class="progress-title" id="progress-title">Writing�</div>
    <div class="progress-status" id="progress-status">
      <span class="spin"></span>Working�
    </div>
    <div id="log"></div>
    <div class="btn-row">
      <button class="btn-secondary hidden" id="btn-stop-write" style="background:#ef4444;color:#fff;border:none;">⏹ Stop</button>
      <button class="btn-primary hidden" id="btn-start-pbcp">Start Prelim - Budget Client Preview</button>
      <button class="btn-secondary" id="btn-back">? Pick a different tab</button>
      <button class="btn-primary" id="btn-close">Close</button>
    </div>
  </div>
</main>

<script src="jspdf.umd.min.js"></script>
<script src="tabpicker.js"></script>
</body>
</html>
